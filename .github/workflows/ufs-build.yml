name: UFS kernel build

# Fork-only: build the mainline kernel with the UFS host enabled (issue #396, 1 TB UFS U30 Air) and
# upload what the device needs (Image, modules, the kernel bundle mu300-update installs).

on:
  workflow_dispatch:
    inputs:
      kv:
        description: 'Kernel version to build'
        required: false
        default: '6.18.60'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Build environment
        run: docker build -t mu300-mainline-build upstream/

      - name: Kernel
        env:
          KV: ${{ inputs.kv }}
        run: |
          docker volume create mu300-mainline
          docker run --rm -e KV="$KV" -v mu300-mainline:/src -v "$PWD/upstream":/work \
            mu300-mainline-build bash /work/build.sh

      - name: Vendor + kernel modules
        env:
          KV: ${{ inputs.kv }}
        run: |
          docker run --rm -e KV="$KV" -v mu300-mainline:/src -v "$PWD/upstream":/work \
            mu300-mainline-build bash /work/build-modules.sh
          ls upstream/out/modules/*.ko | wc -l

      - name: Kernel bundle
        continue-on-error: true
        run: |
          mkdir -p release/ref out
          curl -fsSL -o release/ref/mu300-kernel.tar.gz \
            https://github.com/dikeckaan/mu300-linux/releases/download/v2026.11.02.1/mu300-kernel.tar.gz
          sh upstream/make-bundle.sh out/mu300-kernel-6.18.tar.gz release/ref/mu300-kernel.tar.gz

      - name: Build logs
        if: failure()
        run: |
          tail -n 60 upstream/out/modules/*.log 2>/dev/null || true
          tail -n 40 upstream/out/build.log 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ufs-kernel-${{ inputs.kv }}
          path: |
            upstream/out/Image
            upstream/out/ums9620-mu300.dtb
            upstream/out/kernel.config
            upstream/out/modules/*.ko
            upstream/out/modules.in-tree
            upstream/out/modules.builtin*
            out/mu300-kernel-6.18.tar.gz
          if-no-files-found: warn
